# Production overrides — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:

  postgres:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  minio:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}

  api:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    environment:
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS is required}
    # Actuator on a non-public port
    ports:
      - "8080:8080"
      # Management port intentionally NOT exposed publicly

  app:
    restart: always
    deploy:
      resources:
        limits:
          memory: 64m

  # pgAdmin excluded from production
  pgadmin:
    profiles: ["never"]
